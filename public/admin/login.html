<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — AeroCore Update Server</title>
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body class="centered">
    <main class="card login">
      <h1>AeroCore Update Server</h1>
      <p class="sub">Administrator sign-in</p>

      <!--
        The only way in. This server holds no account of its own, so when the identity
        provider is unreachable there is nothing else to offer — login.js says so rather
        than leaving the page blank.
      -->
      <div id="oidc-block" hidden>
        <a class="button block" id="oidc-signin" href="/admin/api/auth/oidc/start">
          Sign in with Keycloak
        </a>
      </div>

      <!-- Shown only when the server answers that sign-ups are open; see login.js. -->
      <form id="register-form" autocomplete="on" hidden>
        <label for="r-username">Username</label>
        <input id="r-username" name="username" autocomplete="username" required />

        <label for="r-email">Email (optional)</label>
        <input id="r-email" name="email" type="email" autocomplete="email" />

        <label for="r-password">Password</label>
        <input
          id="r-password" name="password" type="password"
          autocomplete="new-password" minlength="8" required
        />

        <button type="submit" id="r-submit">Create account</button>
      </form>

      <p id="error" class="error" hidden></p>
      <p id="notice" class="hint" hidden></p>

      <p id="to-register" class="hint" hidden>
        No account yet? <a href="#" id="show-register">Create one</a>
      </p>
      <p id="to-login" class="hint" hidden>
        Already have an account? <a href="#" id="show-login">Sign in</a>
      </p>

      <p class="hint">Fleet nodes authenticate with a token of their own and never use this page.</p>
    </main>

    <script type="module" src="/admin/login.js"></script>
  </body>
</html>
