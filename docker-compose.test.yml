name: aeroserver-test

# Throwaway PostgreSQL for the integration tests. tmpfs, no volume: it is meant to vanish.
services:
  db:
    image: postgres:17-alpine
    container_name: aeroserver-test-db
    environment:
      POSTGRES_DB: aeroserver_test
      POSTGRES_USER: aeroserver
      POSTGRES_PASSWORD: aeroserver
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroserver -d aeroserver_test"]
      interval: 2s
      timeout: 3s
      retries: 20
