name: aerocoreupdate-test

# Throwaway PostgreSQL for the integration tests. tmpfs, no volume: it is meant to vanish.
services:
  db:
    image: postgres:17-alpine
    container_name: aerocoreupdate-test-db
    environment:
      POSTGRES_DB: aerocoreupdate_test
      POSTGRES_USER: aerocoreupdate
      POSTGRES_PASSWORD: aerocoreupdate
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerocoreupdate -d aerocoreupdate_test"]
      interval: 2s
      timeout: 3s
      retries: 20
