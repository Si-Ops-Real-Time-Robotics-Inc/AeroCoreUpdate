# Development overlay. Never loaded automatically — pass it explicitly:
#
#   npm run dev:docker          bring the stack up with the working tree mounted
#   npm run dev:reload          apply a change to src/ (public/ needs nothing)
#
# The production image bakes src/ and public/ in, which is right for shipping and wrong for
# debugging: every one-line change costs a full rebuild. Here they are mounted read-only from
# the working tree instead, so the container runs exactly the files being edited.
#
# Read-only on purpose. The container must never be able to write back into the repository —
# it runs as `node` (uid 1000), the same uid as the developer on most machines, so a stray
# write would land in the working tree looking like an edit nobody made.
services:
  aerocoreupdate:
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      #
      # NOTE: this shadows the image's /app/public, and the image is where the two UIs are
      # merged — the new bundle at /admin/ and the previous one at /admin/legacy.html. Under
      # this mount the container serves whatever public/admin holds on the host, which is the
      # PREVIOUS UI. Reproducing the merge here needs mountpoints inside a read-only mount,
      # which runc refuses.
      #
      # So the dev loop for the new UI is `npm run dev` in webui/ (vite on :5175, proxying to
      # this container), and the merged arrangement is verified against the built image.
    environment:
      # Readable logs while debugging. Production keeps the default.
      LOG_LEVEL: debug
      # The whole point of the dev loop is watching a real upload land somewhere: leave the
      # shipped default in place rather than pinning it here, so what is debugged is what
      # ships. Override in .env if a session needs something else.
      NODE_ENV: production
